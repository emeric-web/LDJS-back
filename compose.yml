services:
  backend:
    build:
      context: .
    ports:
      - 8080:3000
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/workshopsdb
      CORS_ORIGIN: http://localhost
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: